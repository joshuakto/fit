name: Attach Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach assets to'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.value }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run build

      - name: Upload assets to release
        run: gh release upload "${{ steps.tag.outputs.value }}" main.js manifest.json styles.css --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After the upload, so an attestation problem can't stop the assets from attaching.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
